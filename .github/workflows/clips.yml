name: GTA6 Clips

on:
  schedule:
    - cron: "5 * * * *"   # jede Stunde um :05 (UTC; GitHub startet oft ein paar Minuten später)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts senden"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gta6-clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Whisper-Modell cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ vars.WHISPER_MODEL || 'small' }}

      - name: Python-Pakete
        run: pip install -q -r requirements.txt && pip install -q -U yt-dlp

      - name: Clipbot
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # Optionale Einstellungen (Settings -> Secrets and variables -> Actions -> Variables)
          WHISPER_MODEL: ${{ vars.WHISPER_MODEL }}
          CLIPS_PER_RUN: ${{ vars.CLIPS_PER_RUN }}
          TOP_STREAMERS: ${{ vars.TOP_STREAMERS }}
          FIXED_STREAMERS: ${{ vars.FIXED_STREAMERS }}
          LOOKBACK_MIN: ${{ vars.LOOKBACK_MIN }}
          MIN_VIEWS: ${{ vars.MIN_VIEWS }}
          VIDEO_ZOOM: ${{ vars.VIDEO_ZOOM }}
          NOTIFY_EMPTY: ${{ vars.NOTIFY_EMPTY }}
          HASHTAGS: ${{ vars.HASHTAGS }}
          GAME_NAME: ${{ vars.GAME_NAME }}
        run: python clipbot.py

      - name: Verschickte Clips merken
        if: always()
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add state/sent.json
          if ! git diff --cached --quiet; then
            git commit -q -m "state: $(date -u +%H:%M)"
            git pull -q --rebase && git push -q
          fi
